# Per-layer RGB colors as set in the firmware (layer_state_set_user):
# LOWER = HSV(191,255,255) purple, RAISE = HSV(64,255,255) lime green,
# ADJUST = HSV(170,255,255) blue, COLEMAK = HSV(0,255,255) red. QWERTY keeps the normal RGB effect.
draw_config:
  footer_text: 'On-screen help (Mac): hold ⌘ Esc to see this map · click KB-01 in the menu bar to pin it'
  svg_extra_style: '/* Lilac keycaps; LED color as glow (generated by tools/led_colors.py) */

    rect.key { fill: #e6dbf9; stroke: #b9a6dc; }

    rect.key.led-0004ff { stroke: #0004ffaa; stroke-width: 1.5; filter: drop-shadow(0 0 3px #0004ff88); }

    rect.key.led-00ffff { stroke: #00ffffaa; stroke-width: 1.5; filter: drop-shadow(0 0 3px #00ffff88); }

    rect.key.led-7a00ff { stroke: #7a00ffaa; stroke-width: 1.5; filter: drop-shadow(0 0 3px #7a00ff88); }

    rect.key.led-8000ff { stroke: #8000ffaa; stroke-width: 1.5; filter: drop-shadow(0 0 3px #8000ff88); }

    rect.key.led-80ff00 { stroke: #80ff00aa; stroke-width: 1.5; filter: drop-shadow(0 0 3px #80ff0088); }

    rect.key.led-85ff00 { stroke: #85ff00aa; stroke-width: 1.5; filter: drop-shadow(0 0 3px #85ff0088); }

    rect.key.led-ff0000 { stroke: #ff0000aa; stroke-width: 1.5; filter: drop-shadow(0 0 3px #ff000088); }

    rect.key.led-fffb00 { stroke: #fffb00aa; stroke-width: 1.5; filter: drop-shadow(0 0 3px #fffb0088); }

    text.tl { fill: #5b17b0; } text.tr { fill: #2d6b00; } text.bl { fill: #1f3ac0; } text.td-tl.tl, text.td-tr.tr, text.td-br.br, text.td-s.shifted { fill: #b35a00; font-weight: bold; }

    @keyframes breath { 50% { filter: drop-shadow(0 0 6px var(--lc)); stroke: var(--lc); stroke-width: 2.5; } }

    rect.key.lk-lower { --lc: #a855ff; animation: breath 2.4s ease-in-out infinite; }

    rect.key.lk-raise { --lc: #8cff1a; animation: breath 2.4s ease-in-out infinite; }

    rect.key.lk-adjust { --lc: #4d6bff; animation: breath 2.4s ease-in-out infinite; }

    rect.key.lk-colemak { --lc: #ff3b3b; animation: breath 2.4s ease-in-out infinite; }

    '
