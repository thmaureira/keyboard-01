# Per-layer LED colors of the KB-01 firmware (EVA-01 palette, qmk/kb01/keymap.c layer_colors):
# QWERTY purple with lime green edges, LOWER orange / purple, RAISE lime green / purple,
# ADJUST mint / orange, COLEMAK = QWERTY with Esc and Backspace in red.
draw_config:
  footer_text: 'On-screen help (Mac): hold ⌘ Esc to see this map · click KB-01 in the menu bar to pin it'
  svg_extra_style: '/* Lilac keycaps; LED color as glow (generated by tools/led_colors.py) */

    rect.key { fill: #e6dbf9; stroke: #b9a6dc; }

    rect.key.led-69ffc7 { stroke: #69ffc7aa; stroke-width: 1.5; filter: drop-shadow(0 0 3px #69ffc788); }

    rect.key.led-7400ff { stroke: #7400ffaa; stroke-width: 1.5; filter: drop-shadow(0 0 3px #7400ff88); }

    rect.key.led-80ff00 { stroke: #80ff00aa; stroke-width: 1.5; filter: drop-shadow(0 0 3px #80ff0088); }

    rect.key.led-ff0000 { stroke: #ff0000aa; stroke-width: 1.5; filter: drop-shadow(0 0 3px #ff000088); }

    rect.key.led-ff5400 { stroke: #ff5400aa; stroke-width: 1.5; filter: drop-shadow(0 0 3px #ff540088); }

    rect.key.led-ffbd69 { stroke: #ffbd69aa; stroke-width: 1.5; filter: drop-shadow(0 0 3px #ffbd6988); }

    text.tl { fill: #c24300; } text.tr { fill: #2d6b00; } text.bl { fill: #00806a; } text.td-tl.tl, text.td-tr.tr, text.td-br.br, text.td-s.shifted { fill: #6a00e0; font-weight: bold; }

    @keyframes breath { 50% { filter: drop-shadow(0 0 6px var(--lc)); stroke: var(--lc); stroke-width: 2.5; } }

    rect.key.lk-lower { --lc: #ff6a1a; animation: breath 2.4s ease-in-out infinite; }

    rect.key.lk-raise { --lc: #8cff1a; animation: breath 2.4s ease-in-out infinite; }

    rect.key.lk-adjust { --lc: #69ffc7; animation: breath 2.4s ease-in-out infinite; }

    rect.key.lk-colemak { --lc: #ff3b3b; animation: breath 2.4s ease-in-out infinite; }

    '
